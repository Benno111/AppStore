  <h1>Megacraft Bug Tracker</h1>
  <p style="text-align:center;">Help us improve Megacraft by reporting bugs below.</p>

  <form id="bugForm" onsubmit="event.preventDefault(); submitBug();">
    <label for="bugDescription">Bug Description *</label>
    <textarea id="bugDescription" rows="5" placeholder="Describe what happened..." required></textarea>

    <label for="userEmail">Your Email (optional)</label>
    <input type="email" id="userEmail" placeholder="you@example.com" />

    <button type="submit">Submit Bug</button>
  </form>

  <div id="authStatus">Checking authentication...</div>

  <div id="bugList">
    <!-- Bug reports will appear here -->
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyChjjDaGQFun-FRepLe1epBPaW8XXIkV0Y",
      authDomain: "somethings-1e13b.firebaseapp.com",
      databaseURL: "https://somethings-1e13b-default-rtdb.firebaseio.com",
      projectId: "somethings-1e13b",
      storageBucket: "somethings-1e13b.firebasestorage.app",
      messagingSenderId: "575513186640",
      appId: "1:575513186640:web:f050f93b268a5e306d1c55"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    const authStatusEl = document.getElementById("authStatus");

    // Sign in anonymously on page load
    auth.signInAnonymously()
      .then(() => {
        authStatusEl.textContent = "Signed in anonymously. You can submit bugs.";
      })
      .catch(error => {
        authStatusEl.textContent = "Auth error: " + error.message;
      });

    // Submit bug report
    function submitBug() {
      const user = auth.currentUser;
      if (!user) {
        alert("You must be signed in to submit a bug.");
        return;
      }

      const description = document.getElementById("bugDescription").value.trim();
      const emailInput = document.getElementById("userEmail").value.trim();

      if (!description) {
        alert("Please describe the bug.");
        return;
      }

      const email = emailInput || "Anonymous";

      const newBugRef = database.ref('bugReports').push();
      newBugRef.set({
        description,
        email,
        timestamp: Date.now(),
        uid: user.uid
      }).then(() => {
        alert("Bug report submitted. Thank you!");
        document.getElementById("bugForm").reset();
      }).catch(error => {
        alert("Error submitting bug: " + error.message);
      });
    }

    // Render bug list
    function renderBugList(bugs) {
      const listEl = document.getElementById("bugList");
      listEl.innerHTML = "";

      if (!bugs) {
        listEl.innerHTML = "<p>No bug reports yet.</p>";
        return;
      }

      const bugArray = Object.values(bugs).sort((a, b) => b.timestamp - a.timestamp);

      bugArray.forEach(bug => {
        const date = new Date(bug.timestamp).toLocaleString();
        const item = document.createElement("div");
        item.style.borderBottom = "1px solid #333";
        item.style.padding = "0.5em 0";
        item.innerHTML = `
          <p><strong>${escapeHtml(bug.email)}</strong> reported at <em>${escapeHtml(date)}</em></p>
          <p>${escapeHtml(bug.description).replace(/\n/g, "<br>")}</p>
        `;
        listEl.appendChild(item);
      });
    }

    // Listen for bug report updates
    const bugReportsRef = database.ref('bugReports');
    bugReportsRef.on('value', snapshot => {
      renderBugList(snapshot.val());
    });

    // Simple HTML escape to avoid injection
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
