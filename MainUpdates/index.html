<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body { font-family: monospace; padding: 1rem; background: #f7f7f7; }
    pre { background: white; padding: 1rem; border: 1px solid #ccc; overflow: auto; }
  </style>
</head>
<body>
  <pre id="file-content">Loading...</pre>

  <script>
    const owner = "Benno111"; // replace with actual owner
    const repo = "AppStore"; // replace with actual repo
    const path = "index.html"; // folder path in repo
    const branch = "main"; // or master, or a specific branch

    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;

    fetch(apiUrl)
      .then(res => res.json())
      .then(data => {
        if (data.content) {
          const content = atob(data.content); // decode base64
          document.getElementById('file-content').textContent = content;
        } else {
          document.getElementById('file-content').textContent = "File content not available.";
        }
      })
      .catch(err => {
        document.getElementById('file-content').textContent = "Failed to fetch file.";
        console.error(err);
      });
  </script>
</body>
</html>
