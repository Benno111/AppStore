  <style>

<body>

  <nav class="topbar">
    <a href="index.html">🏠 Download</a>
    <a href="bugtracker.html">🐞 Bug Tracker</a>
    <a href="patchnotes.html">📄 Patch Notes</a>
  </nav>

  <h1>Megacraft Patch Notes</h1>

  <div id="patchNotesContainer">Loading patch notes...</div>

  <div id="adminForm">
    <h2>Add Patch Note (Admin Only)</h2>
    <input id="versionInput" placeholder="Version (e.g. v1.3 Nightly – July 2025)" />
    <textarea id="changesInput" rows="6" placeholder="Enter changes, one per line"></textarea>
    <button onclick="submitPatchNote()">Submit Patch</button>
  </div>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyChjjDaGQFun-FRepLe1epBPaW8XXIkV0Y",
      authDomain: "somethings-1e13b.firebaseapp.com",
      databaseURL: "https://somethings-1e13b-default-rtdb.firebaseio.com",
      projectId: "somethings-1e13b",
      storageBucket: "somethings-1e13b.appspot.com",
      messagingSenderId: "575513186640",
      appId: "1:575513186640:web:f050f93b268a5e306d1c55"
    };

    // Init Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const patchNotesContainer = document.getElementById("patchNotesContainer");
    const adminForm = document.getElementById("adminForm");

    // Load patch notes from DB
    firebase.database().ref("changelog").on("value", (snapshot) => {
      const data = snapshot.val();
      patchNotesContainer.innerHTML = "";
      if (!data) {
        patchNotesContainer.innerHTML = "<p>No patch notes found.</p>";
        return;
      }

      // Convert to array and reverse by timestamp
      const entries = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);
      entries.forEach(entry => {
        const div = document.createElement("div");
        div.className = "version";

        const title = document.createElement("h2");
        title.textContent = entry.version;

        const ul = document.createElement("ul");
        entry.changes.forEach(c => {
          const li = document.createElement("li");
          li.textContent = c;
          ul.appendChild(li);
        });

        div.appendChild(title);
        div.appendChild(ul);
        patchNotesContainer.appendChild(div);
      });
    });

    // Auth login (Anonymous or Email/Password)
    auth.signInAnonymously()
      .then(() => {
        // Show form only if not anonymous
        auth.onAuthStateChanged((user) => {
          if (user && !user.isAnonymous) {
            adminForm.style.display = "block";
          }
        });
      }).catch(err => {
        console.error("Auth error:", err.message);
      });

    // Submit patch note (admin only)
    function submitPatchNote() {
      const version = document.getElementById("versionInput").value.trim();
      const changesRaw = document.getElementById("changesInput").value.trim();

      if (!version || !changesRaw) {
        alert("Please fill in all fields.");
        return;
      }

      const changes = changesRaw.split("\n").map(c => c.trim()).filter(Boolean);
      const newRef = db.ref("changelog").push();

      newRef.set({
        version,
        changes,
        timestamp: Date.now()
      }).then(() => {
        alert("Patch note added.");
        document.getElementById("versionInput").value = "";
        document.getElementById("changesInput").value = "";
      }).catch(err => {
        alert("Error: " + err.message);
      });
    }
  </script>
</body>
