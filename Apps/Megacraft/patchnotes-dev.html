  <style>
    body {
      font-family: sans-serif;
      background-color: #111;
      color: #eee;
      margin: 0;
      padding: 2em;
      padding-top: 6em;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    h1 {
      color: #00ffcc;
      text-align: center;
    }

    .version {
      background: #222;
      padding: 1em;
      border-radius: 10px;
      margin-top: 2em;
    }

    .version h2 {
      color: #00cc88;
    }

    ul {
      padding-left: 1.5em;
    }

    nav.topbar {
      background: #1a1a1a;
      padding: 0.8em;
      display: flex;
      justify-content: center;
      gap: 2em;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }

    nav.topbar a {
      color: #eee;
      text-decoration: none;
      font-weight: bold;
    }

    nav.topbar a:hover {
      color: #00ffcc;
    }

    #authForm input {
      padding: 0.5em;
      margin: 0.3em;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 5px;
    }

    #authForm button {
      background: #00cc88;
      color: #fff;
      border: none;
      padding: 0.5em 1.5em;
      margin-top: 0.5em;
      border-radius: 8px;
      cursor: pointer;
    }

    #authForm button:hover {
      background: #00aa77;
    }

    #adminForm {
      margin-top: 3em;
      display: none;
      background: #1a1a1a;
      padding: 1em;
      border-radius: 10px;
    }

    #adminForm textarea, #adminForm input {
      width: 100%;
      margin: 0.5em 0;
      background: #222;
      color: #fff;
      border: none;
      padding: 0.7em;
      border-radius: 5px;
    }

    #logoutBtn {
      display: none;
      background: #444;
      border: none;
      color: #ccc;
      padding: 0.4em 1em;
      margin-top: 1em;
      border-radius: 6px;
    }

    #logoutBtn:hover {
      background: #666;
    }

    #userInfo {
      margin-top: 0.5em;
      color: #aaa;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <nav class="topbar">
    <a href="bugadmin.html">🐞 Bug Tracker Admin</a>
    <a href="patchnotes-dev.html">🛠️ Patch Notes Admin</a>
    <a href="index.html">🆕Download</a>    
  </nav>

  <h1>Megacraft Patch Notes</h1>

  <div id="authForm">
    <input id="emailInput" type="email" placeholder="Email" />
    <input id="passwordInput" type="password" placeholder="Password" />
    <br />
    <button onclick="login()">🔐 Login</button>
    <br />
    <button id="logoutBtn" onclick="logout()">🚪 Logout</button>
    <div id="userInfo"></div>
  </div>

  <div id="patchNotesContainer">Loading patch notes...</div>

  <div id="adminForm">
    <h2>Add Patch Note</h2>
    <input id="versionInput" placeholder="Version (e.g. v1.3 Nightly – July 2025)" />
    <textarea id="changesInput" rows="6" placeholder="Enter changes, one per line"></textarea>
    <button onclick="submitPatchNote()">Submit Patch</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyChjjDaGQFun-FRepLe1epBPaW8XXIkV0Y",
      authDomain: "somethings-1e13b.firebaseapp.com",
      databaseURL: "https://somethings-1e13b-default-rtdb.firebaseio.com",
      projectId: "somethings-1e13b",
      storageBucket: "somethings-1e13b.appspot.com",
      messagingSenderId: "575513186640",
      appId: "1:575513186640:web:f050f93b268a5e306d1c55"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const patchNotesContainer = document.getElementById("patchNotesContainer");
    const adminForm = document.getElementById("adminForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const userInfo = document.getElementById("userInfo");

    // Load patch notes
    db.ref("changelog").on("value", (snapshot) => {
      const data = snapshot.val();
      patchNotesContainer.innerHTML = "";
      if (!data) {
        patchNotesContainer.innerHTML = "<p>No patch notes found.</p>";
        return;
      }

      const entries = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);
      entries.forEach(entry => {
        const div = document.createElement("div");
        div.className = "version";

        const h2 = document.createElement("h2");
        h2.textContent = entry.version;

        const ul = document.createElement("ul");
        entry.changes.forEach(c => {
          const li = document.createElement("li");
          li.textContent = c;
          ul.appendChild(li);
        });

        div.appendChild(h2);
        div.appendChild(ul);
        patchNotesContainer.appendChild(div);
      });
    });

    // Email login
    function login() {
      const email = document.getElementById("emailInput").value;
      const password = document.getElementById("passwordInput").value;
      auth.signInWithEmailAndPassword(email, password)
        .catch(e => alert("Login failed: " + e.message));
    }
    // Logout
    function logout() {
      auth.signOut();
    }

    // Auth state change
    auth.onAuthStateChanged(user => {
      if (user) {
        adminForm.style.display = "block";
        logoutBtn.style.display = "inline-block";
        userInfo.textContent = "Logged in as: " + (user.email || user.uid);
      } else {
        adminForm.style.display = "none";
        logoutBtn.style.display = "none";
        userInfo.textContent = "";
      }
    });

    // Submit new patch note
    function submitPatchNote() {
      const version = document.getElementById("versionInput").value.trim();
      const changesRaw = document.getElementById("changesInput").value.trim();
      if (!version || !changesRaw) return alert("Fill out both fields.");

      const changes = changesRaw.split("\n").map(c => c.trim()).filter(Boolean);
      db.ref("changelog").push({
        version,
        changes,
        timestamp: Date.now()
      }).then(() => {
        alert("Patch note added!");
        document.getElementById("versionInput").value = "";
        document.getElementById("changesInput").value = "";
      }).catch(e => alert("Error: " + e.message));
    }
  </script>
</body>
</html>
